<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Go to Site</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      border: 1px solid #ccc;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
      text-align: center;
    }
    button {
      width: 100%;
      font-size: 1rem;
      padding: 14px 16px;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Go to a Site</h1>
    <button id="goBtn">Enter a website</button>
  </div>

  <script>
    document.getElementById("goBtn").addEventListener("click", () => {
      let site = prompt("Enter a website URL:");
      if (!site) return;

      site = site.trim();

      if (!/^https?:\/\//i.test(site)) {
        site = "https://" + site;
      }

      try {
        const url = new URL(site);
        window.location.replace(url.href);
      } catch (e) {
        alert("Please enter a valid website address.");
      }
    });
  </script>
</body>
</html>
